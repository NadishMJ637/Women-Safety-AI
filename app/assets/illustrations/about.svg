<svg viewBox="0 0 320 280" xmlns="http://www.w3.org/2000/svg">
  <ellipse cx="160" cy="255" rx="95" ry="13" fill="#1E2340" opacity="0.06"/>

  <!-- person body -->
  <path d="M120 260 C118 210 122 180 160 178 C198 180 202 210 200 260 Z" fill="#2A3050"/>
  <!-- head -->
  <circle cx="160" cy="120" r="38" fill="#F2C9A0"/>
  <!-- hair -->
  <path d="M124 112 C120 84 138 66 160 66 C182 66 200 84 196 112 C188 100 176 96 160 96 C144 96 132 100 124 112 Z" fill="#1E2340"/>
  <!-- eyes -->
  <circle cx="148" cy="122" r="4.5" fill="#1E2340"/>
  <circle cx="172" cy="122" r="4.5" fill="#1E2340"/>
  <!-- smile -->
  <path d="M146 136 Q160 148 174 136" stroke="#1E2340" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <!-- cheeks -->
  <circle cx="140" cy="132" r="5" fill="#B8433D" opacity="0.2"/>
  <circle cx="180" cy="132" r="5" fill="#B8433D" opacity="0.2"/>

  <!-- shoulders/collar -->
  <path d="M132 178 Q160 195 188 178" stroke="#0F9B8E" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- shield badge held in front -->
  <g transform="translate(160,205)">
    <path d="M0 -32 L28 -20 C28 4 16 24 0 34 C-16 24 -28 4 -28 -20 Z"
          fill="#0F9B8E" stroke="#F5F6FA" stroke-width="4" stroke-linejoin="round"/>
    <path d="M-10 -2 l7 7 15 -16" stroke="#FFFFFF" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- floating heart -->
  <path d="M245 90 c-5-6-14-3-14 4 0 8 14 15 14 15s14-7 14-15c0-7-9-10-14-4z" fill="#B8433D" opacity="0.55"/>

  <!-- sparkle -->
  <path d="M70 70 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3 z" fill="#B8802B" opacity="0.7"/>
</svg>
