  <path d="M95 180 l0 26 26 -26 z" fill="#FFFFFF" stroke="#E2E4EF" stroke-width="3"/>

  <!-- text lines -->
  <rect x="80" y="68" width="120" height="8" rx="4" fill="#E2E4EF"/>
  <rect x="80" y="88" width="95" height="8" rx="4" fill="#E2E4EF"/>
  <rect x="80" y="108" width="110" height="8" rx="4" fill="#FBF0DE"/>
  <rect x="80" y="128" width="70" height="8" rx="4" fill="#E2E4EF"/>

  <!-- highlighted risky phrase -->
  <rect x="80" y="148" width="60" height="14" rx="7" fill="#FBE7E5"/>
  <rect x="86" y="152" width="48" height="6" rx="3" fill="#B8433D" opacity="0.55"/>

  <!-- magnifying glass -->
  <circle cx="235" cy="120" r="46" fill="#E4F5F2" stroke="#0F9B8E" stroke-width="6"/>
  <circle cx="235" cy="120" r="30" fill="#FFFFFF" opacity="0.5"/>
  <line x1="268" y1="153" x2="298" y2="183" stroke="#1E2340" stroke-width="10" stroke-linecap="round"/>
  <line x1="268" y1="153" x2="298" y2="183" stroke="#0F9B8E" stroke-width="4" stroke-linecap="round"/>

  <!-- little shield inside glass -->
