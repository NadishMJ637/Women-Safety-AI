<svg viewBox="0 0 320 260" xmlns="http://www.w3.org/2000/svg">
  <ellipse cx="160" cy="235" rx="95" ry="12" fill="#1E2340" opacity="0.06"/>

  <!-- robot head -->
  <rect x="95" y="60" width="130" height="110" rx="28" fill="#1E2340"/>
  <rect x="112" y="78" width="96" height="70" rx="18" fill="#2A3050"/>

  <!-- antenna -->
  <line x1="160" y1="60" x2="160" y2="36" stroke="#1E2340" stroke-width="6" stroke-linecap="round"/>
  <circle cx="160" cy="30" r="9" fill="#B8802B"/>

  <!-- eyes -->
  <circle cx="140" cy="112" r="12" fill="#0F9B8E"/>
  <circle cx="180" cy="112" r="12" fill="#0F9B8E"/>
  <circle cx="140" cy="112" r="4" fill="#FFFFFF"/>
  <circle cx="180" cy="112" r="4" fill="#FFFFFF"/>

  <!-- smile -->
  <path d="M138 132 Q160 146 182 132" stroke="#0F9B8E" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- side gear left -->
  <g fill="#B8802B">
    <circle cx="70" cy="140" r="20"/>
    <g stroke="#B8802B" stroke-width="6">
      <line x1="70" y1="112" x2="70" y2="122"/>
      <line x1="70" y1="158" x2="70" y2="168"/>
      <line x1="42" y1="140" x2="52" y2="140"/>
      <line x1="88" y1="140" x2="98" y2="140"/>
    </g>
  </g>
  <circle cx="70" cy="140" r="9" fill="#F5F6FA"/>

  <!-- side gear right -->
  <g fill="#0F9B8E">
    <circle cx="250" cy="100" r="15"/>
    <g stroke="#0F9B8E" stroke-width="5">
      <line x1="250" y1="79" x2="250" y2="87"/>
      <line x1="250" y1="113" x2="250" y2="121"/>
      <line x1="229" y1="100" x2="237" y2="100"/>
      <line x1="263" y1="100" x2="271" y2="100"/>
    </g>
  </g>
  <circle cx="250" cy="100" r="6.5" fill="#F5F6FA"/>

  <!-- circuit lines on chest area -->
  <g stroke="#0F9B8E" stroke-width="3" fill="none" opacity="0.5" stroke-linecap="round">
    <path d="M112 165 v18 h20"/>
    <path d="M208 165 v18 h-20"/>
  </g>

  <!-- little legs -->
  <rect x="122" y="170" width="16" height="26" rx="6" fill="#1E2340"/>
  <rect x="182" y="170" width="16" height="26" rx="6" fill="#1E2340"/>
</svg>
